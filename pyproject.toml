[project]
name = "coursestack-mcp"
version = "0.1.0"
description = "MCP server for authoring CourseStack courses via the CourseStack REST API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27",
]

[project.scripts]
coursestack-mcp = "coursestack_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coursestack_mcp"]
